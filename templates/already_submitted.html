<!DOCTYPE html>
<html>
<head>
    <title>Application Submitted</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #eef2f7, #dfe9f3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .submitted-box {
            background: white;
            padding: 60px 80px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 500px;
        }
        
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        
        h2 {
            color: #1e3a8a;
            margin-bottom: 15px;
            font-size: 28px;
        }
        
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.6;
        }
        
        button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 18px rgba(37,99,235,0.3);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(37,99,235,0.4);
        }
    </style>
</head>
<body>

    <div class="submitted-box">
        <div class="icon">✅</div>
        <h2>Application Already Submitted</h2>
        <p>Your application has been successfully locked for processing. You cannot edit or go back to previous steps.</p>
        
        <a href="{% url 'student_dashboard' %}">
            <button>Back to Dashboard</button>
        </a>
    </div>

</body>
</html>
