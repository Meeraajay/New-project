{% extends 'base.html' %}

{% block content %}

<div class="form-container">

    <center>
        <h2>Course Preference</h2>
        <br>
    </center>

    <!-- =========================
         SAVE PREFERENCES FORM
    ========================== -->
    <form method="POST">

        {% csrf_token %}

        <table class="cbsemarks-table">

            <tr>
                <th>Preference</th>
                <th>Course</th>
            </tr>

            <tr>
                <td>Preference 1</td>
                <td>
                    <select name="pref1" required>
                        <option value="">Select Course</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Bio-Mathematics">Bio-Mathematics</option>
                        <option value="Commerce">Commerce</option>
                        <option value="Humanities">Humanities</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Preference 2</td>
                <td>
                    <select name="pref2" required>
                        <option value="">Select Course</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Bio-Mathematics">Bio-Mathematics</option>
                        <option value="Commerce">Commerce</option>
                        <option value="Humanities">Humanities</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Preference 3</td>
                <td>
                    <select name="pref3" required>
                        <option value="">Select Course</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Bio-Mathematics">Bio-Mathematics</option>
                        <option value="Commerce">Commerce</option>
                        <option value="Humanities">Humanities</option>
                    </select>
                </td>
            </tr>

        </table>

        <br>

        <button type="submit" class="btn">
            Save Preferences
        </button>

    </form>

    <br><br>

    <!-- =========================
         FINAL SUBMIT FORM
    ========================== -->
    <form method="POST" action="{% url 'submit_final' %}">

        {% csrf_token %}

        <center>

            <button type="submit" class="btn btn-success">
                Submit Final Application
            </button>

            <p style="margin-top:10px; color:gray;">
                Once submitted, your application will be locked.
            </p>

        </center>

    </form>

</div>

{% endblock %}
