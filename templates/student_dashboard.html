<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>

    <style>
        /* ===================== RESET ===================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef2f7, #dfe9f3);
            min-height: 100vh;
        }

        /* ===================== TOP BAR ===================== */
        .top-bar {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: flex-end;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #bb2d3b;
            transform: translateY(-2px);
        }

        /* ===================== DASHBOARD ===================== */
        .dashboard {
            max-width: 1100px;
            margin: 20px auto;
            padding: 20px;
            text-align: center;
        }

        .dashboard h1 {
            margin-bottom: 30px;
            color: #1e3a8a;
            font-size: 32px;
            font-weight: 700;
        }

        /* ===================== COURSE BOX ===================== */
        .course-box {
            background: white;
            padding: 30px;
            margin: 25px auto;
            width: 70%;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            text-align: left;
            transition: 0.3s;
        }

        .course-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.12);
        }

        .course-box h2 {
            margin-bottom: 15px;
            color: #1e3a8a;
        }

        .course-box ul {
            list-style: none;
            margin-top: 10px;
        }

        .course-box li {
            padding: 14px 12px;
            margin-bottom: 8px;
            border-radius: 10px;
            background: #f5f7ff;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid #e6e9f5;
            transition: 0.3s;
        }

        .course-box li:hover {
            background: #e9efff;
            transform: translateX(5px);
        }

        /* ===================== APPLY BUTTON ===================== */
        .apply-btn {
            display: inline-block;
            padding: 14px 28px;
            background: linear-gradient(135deg, #28a745, #1f9d55);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 25px;
            transition: 0.3s;
            box-shadow: 0 8px 18px rgba(40, 167, 69, 0.3);
        }

        .apply-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(40, 167, 69, 0.4);
        }

    </style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
    <a href="{% url 'logout' %}" class="logout-btn">
        Logout
    </a>
</div>

<div class="dashboard">

    <h1>
        Welcome {{ student.name|default:request.user.username }}
    </h1>

    <!-- COURSES -->
    <div class="course-box">
        <h2>Courses Offered</h2>

        <ul>
            <li>Computer Science</li>
            <li>Bio-Mathematics</li>
            <li>Commerce</li>
            <li>Humanities</li>
        </ul>
    </div>

    <!-- APPLY BUTTON -->
    <a href="{% url 'profile' %}" class="apply-btn">
        Apply Now
    </a>

</div>

</body>
</html>
